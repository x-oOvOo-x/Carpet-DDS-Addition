import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://jitpack.io'; content { includeGroupAndSubgroups('com.github') } }
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.replaymod.preprocess') useModule("com.github.x-oOvOo-x:preprocessor:${requested.version}")
        }
    }
}

plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' }

/* Shared per-version run isolation; fake-player client resources now belong to DDS Tweak. */
def versionRunIsolationScript=file('gradle/version-run-isolation.gradle')
gradle.beforeProject { p -> if(p.path!=':')p.apply(from:versionRunIsolationScript) }

def cfg=new JsonSlurper().parseText(file('settings.json').text)
for(String version:cfg.versions){include(":${version}");def p=project(":${version}");p.projectDir=file("versions/${version}");p.buildFileName='../../common.gradle'}
