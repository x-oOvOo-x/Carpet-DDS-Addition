/*
 * Establish an explicit newest -> oldest ordering between the build tasks.
 *
 * This is an ordering constraint only. It does not make one Minecraft
 * version depend functionally on another Minecraft version.
 */
gradle.projectsEvaluated {
    for (int i = 1; i < supportedVersions.size(); i++) {
        def currentVersion = supportedVersions[i]
        def previousVersion = supportedVersions[i - 1]

        project(":${currentVersion}")
                .tasks
                .named('build')
                .configure {
                    mustRunAfter(":${previousVersion}:build")
                }
    }
}

/*
 * Mixin audits are deliberately serialized.
 *
 * Even though every target owns an isolated run directory, starting dozens of
 * Minecraft JVMs in parallel provides no useful signal and unnecessarily
 * increases memory/toolchain pressure.
 */
gradle.projectsEvaluated {
    supportedVersions.each { version ->
        project(":${version}")
                .tasks
                .named('runMixinAuditClient')
                .configure {
                    mustRunAfter(
                            ":${version}:runMixinAudit"
                    )
                }
    }

    for (int i = 1; i < supportedVersions.size(); i++) {
        def currentVersion = supportedVersions[i]
        def previousVersion = supportedVersions[i - 1]

        project(":${currentVersion}")
                .tasks
                .named('runMixinAudit')
                .configure {
                    mustRunAfter(
                            ":${previousVersion}:runMixinAuditClient"
                    )
                }
    }
}

/*
 * Resolve and verify the game Java launcher for every supported target.
 *
 * This is opt-in and not part of normal builds because a fresh machine may
 * need to download several distinct JDK major versions.
 */
tasks.register('verifyJavaRuntimes') {
    group = 'verification'

    description =
            'Verifies the Java runtime selected for every Minecraft target.'

    dependsOn(javaRuntimeVerificationTaskPaths)
}


/*
 * Run the canonical shared-network JVM contract suite.
 */
tasks.register('testNetworkContracts') {
    group = 'verification'

    description =
            'Runs shared DDS network contract tests on Minecraft 1.21.11.'

    dependsOn(':1.21.11:test')
}

/*
 * Run server + client Mixin audit on the canonical DDS development target.
 *
 * This is the normal fast verification gate while implementing/refactoring
 * Mixins.
 */
tasks.register('auditMixinsCanonical') {
    group = 'verification'

    description =
            'Audits server and client Mixins on Minecraft 1.21.11.'

    dependsOn(
            ':1.21.11:runMixinAudit',
            ':1.21.11:runMixinAuditClient'
    )
}


/*
 * Run server + client Mixin audit on every supported Minecraft target.
 *
 * This is intentionally opt-in instead of part of buildAll because it launches
 * Minecraft once for each environment/version combination.
 */
tasks.register('auditMixinsAll') {
    group = 'verification'

    description =
            'Audits server and client Mixins on every supported Minecraft target.'

    dependsOn(mixinAuditTaskPaths)
}

/*
 * Build every supported Minecraft target.
 */
tasks.register('buildAll') {
    group = 'build'

    description =
            'Builds every supported Minecraft target from newest to oldest.'

    dependsOn(orderedBuildTaskPaths)
}


/*
 * Build every supported Minecraft target and gather release jars.
 */
tasks.register('buildAndGather') {
    group = 'build'

    description =
            'Builds all targets from newest to oldest and copies release jars into build/releases.'

    dependsOn(orderedBuildTaskPaths)

    doLast {
        def out = layout
                .buildDirectory
                .dir('releases')
                .get()
                .asFile

        delete out
        out.mkdirs()

        /*
         * Gather in the same newest -> oldest order used by settings.json.
         */
        supportedVersions.each { version ->
            def p = project(":${version}")

            copy {
                from(new File(p.buildDir, 'libs'))

                include('*.jar')

                exclude(
                        '*-sources.jar',
                        '*-dev.jar'
                )

                into(out)
            }
        }

        println "Release jars: ${out}"
    }
}
