import groovy.json.JsonSlurper

plugins {
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
    id 'com.replaymod.preprocess' version 'dds-dev-0.3.3'
}


/*
 * Supported Minecraft versions.
 *
 * settings.json is the single source of truth for the human-facing version
 * order. Versions are always maintained from newest to oldest.
 */
def versionConfig = new JsonSlurper().parseText(
        file('settings.json').getText('UTF-8')
)

def supportedVersions = versionConfig.versions.collect {
    it.toString()
}

def orderedBuildTaskPaths = supportedVersions.collect {
    ":${it}:build"
}

def javaRuntimeVerificationTaskPaths = supportedVersions.collect {
    ":${it}:verifyJavaRuntime"
}

def mixinAuditTaskPaths = supportedVersions.collectMany { version ->
    [
            ":${version}:runMixinAudit",
            ":${version}:runMixinAuditClient",
    ]
}

