import groovy.json.JsonOutput
import groovy.json.JsonSlurper

final def ddsClientOwnershipContract = new JsonSlurper().parseText(
        rootProject.file('config/dds-client-ownership-contract.json').getText('UTF-8')
)
final Map<String, ?> ownershipTargetsByVersion =
        ddsClientOwnershipContract.targets.collectEntries { target ->
            [(target.minecraft.toString()): target]
        }
final Set<String> productionHandoffVersions =
        ddsClientOwnershipContract.targets.findAll { target ->
            target.ddsStatus == 'active'
                    && target.ddsPublishesTweakOwnership == true
        }.collect { target ->
            target.minecraft.toString()
        } as Set

final Set<String> logicalClientMixins = [] as Set

final def ownershipTarget = ownershipTargetsByVersion[project.minecraft_version]
final boolean logicalClientHandedOff =
        productionHandoffVersions.contains(project.minecraft_version)
final String handoffWireMode =
        logicalClientHandedOff
                ? ownershipTarget?.wireMode?.toString()
                : null

final int mcVersion = project.mcVersion
final boolean unobfuscated = mcVersion >= 26_00_00

apply plugin: 'maven-publish'
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = 'https://masa.dy.fi/maven'
        content { includeModule('carpet', 'fabric-carpet') }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup('maven.modrinth') }
    }
}

// Loom's modImplementation/implementation are dependency configurations, not
// Project methods. Address them by configuration name so this also works when
// the ReplayMod preprocessor evaluates another version project recursively.
def runtimeModConfiguration = unobfuscated ? 'implementation' : 'modImplementation'

/*
 * Shared network contracts are exercised once on the canonical DDS
 * development target. Cross-version preprocessing/compilation remains covered
 * by buildAll/buildAndGather.
 */
final boolean networkContractTestTarget =
        project.minecraft_version == '1.21.11'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }
    add(runtimeModConfiguration, "net.fabricmc:fabric-loader:${project.loader_version}")

    // Fabric Loader >= 0.17.0 already provides MixinExtras with @WrapMethod.
    // Per-target minimum Loader versions are declared in versions/*/gradle.properties.
    if (mcVersion >= 1_19_02) {
        add('compileOnly', 'org.anti-ad.mc:inventory-profiles-next:fabric-1.17.1-1.1.0') { transitive = false }
    }

    // Prefer the creator/Masa Maven coordinate, but allow a version node to
    // override it with an exact full dependency coordinate when an old Carpet
    // artifact is only archived elsewhere (for example Modrinth).
    def carpetNotation = project.findProperty('carpet_core_dependency')
            ?: "carpet:fabric-carpet:${project.carpet_core_version}"
    add(runtimeModConfiguration, carpetNotation)

    if (networkContractTestTarget) {
        add(
                'testImplementation',
                platform(
                        'org.junit:junit-bom:5.13.4'
                )
        )

        add(
                'testImplementation',
                'org.junit.jupiter:junit-jupiter'
        )

        add(
                'testRuntimeOnly',
                'org.junit.platform:junit-platform-launcher'
        )
    }
}

JavaVersion javaCompatibility
if (mcVersion >= 26_00_00) {
    javaCompatibility = JavaVersion.VERSION_25
} else if (mcVersion >= 1_20_05) {
    javaCompatibility = JavaVersion.VERSION_21
} else if (mcVersion >= 1_18_00) {
    javaCompatibility = JavaVersion.VERSION_17
} else if (mcVersion >= 1_17_00) {
    javaCompatibility = JavaVersion.VERSION_16
} else {
    javaCompatibility = JavaVersion.VERSION_1_8
}

/*
 * Keep one Java-version source of truth.
 *
 * javaCompatibility already drives sourceCompatibility, targetCompatibility,
 * javac --release, fabric.mod.json and Mixin compatibility. The game runtime
 * launcher is derived from the same value so build metadata and runClient /
 * runServer cannot silently drift apart.
 *
 * Do not set java.toolchain here: compilation intentionally keeps its current
 * behavior. Only the Minecraft JavaExec run tasks use this launcher.
 */
final int javaLevel =
        Integer.parseInt(javaCompatibility.majorVersion)

final def gameJavaLauncher =
        javaToolchains.launcherFor {
            languageVersion =
                    org.gradle.jvm.toolchain.JavaLanguageVersion.of(
                            javaLevel
                    )

            /*
             * Pin DDS game runtimes to Azul Zulu.
             *
             * Foojay otherwise prefers Temurin when vendor is unspecified.
             * Temurin Windows archives are hosted on GitHub Releases, which
             * is not reliably reachable from every DDS development machine.
             *
             * Zulu provides every Java major DDS currently requires,
             * including historical Java 8 and Java 16 builds.
             */
            vendor =
                    org.gradle.jvm.toolchain.JvmVendorSpec.AZUL
        }

// Rule definitions are source-of-truth JSON. The generator keeps old/new Carpet
// annotation differences out of business code, so future rules are added once.
def generatedRuleDir = layout.buildDirectory.dir('generated/sources/ddsRules/java').get().asFile
def generatedRuleResourceDir = layout.buildDirectory.dir('generated/resources/ddsRules').get().asFile
def ruleSpecFile = rootProject.file('src/main/rules/rules.json')

tasks.register('generateDDSRules') {
    inputs.file(ruleSpecFile)
    inputs.property('rule_api', project.rule_api)
    outputs.dir(generatedRuleDir)
    outputs.dir(generatedRuleResourceDir)

    doLast {
        delete generatedRuleDir
        delete generatedRuleResourceDir

        def spec = new JsonSlurper().parse(ruleSpecFile)

        def isRuleActive = { rule ->
            int minMc = rule.containsKey('minMc') ? (rule.minMc as int) : Integer.MIN_VALUE
            int maxMc = rule.containsKey('maxMc') ? (rule.maxMc as int) : Integer.MAX_VALUE
            mcVersion >= minMc && mcVersion <= maxMc
        }

        def activeRules = spec.rules.findAll { rule -> isRuleActive(rule) }

        def javaLiteral = { rule ->
            switch (rule.type) {
                case 'boolean':
                case 'int':
                case 'double':
                    return rule.default.toString()
                case 'String':
                    return '"' + rule.default.toString()
                            .replace('\\', '\\\\')
                            .replace('"', '\\"') + '"'
                default:
                    throw new GradleException("Unsupported DDS rule type: ${rule.type}")
            }
        }

        def wrapperType = { rule ->
            switch (rule.type) {
                case 'boolean': return 'Boolean'
                case 'int': return 'Integer'
                case 'double': return 'Double'
                case 'String': return 'String'
                default: throw new GradleException("Unsupported DDS rule type: ${rule.type}")
            }
        }

        def codecName = { rule ->
            switch (rule.type) {
                case 'boolean': return 'BOOLEAN'
                case 'int': return 'INTEGER'
                case 'double': return 'DOUBLE'
                case 'String': return 'STRING'
                default: throw new GradleException("Unsupported DDS rule type: ${rule.type}")
            }
        }

        def constantName = { rule ->
            rule.name.toString()
                    .replaceAll(/([a-z0-9])([A-Z])/, '$1_$2')
                    .toUpperCase(Locale.ROOT)
        }

        def quote = { value ->
            '"' + value.toString()
                    .replace('\\', '\\\\')
                    .replace('"', '\\"') + '"'
        }

        def stringArray = { Collection<?> values ->
            'new String[]{' + values.collect { quote(it) }.join(', ') + '}'
        }

        def categoriesFor = { rule ->
            ['DDS'] + rule.categories.collect { it.toString() }
        }

        def suggestionsFor = { rule ->
            if (rule.containsKey('suggestions')) {
                return rule.suggestions.collect { it.toString() }
            }
            if (rule.type == 'boolean') return ['true', 'false']
            return []
        }

        def strictFor = { rule ->
            rule.containsKey('strict') ? (rule.strict as boolean) : true
        }

        def pkgDir = new File(generatedRuleDir, 'carpetddsaddition/generated')
        pkgDir.mkdirs()

        def f = new File(pkgDir, 'CarpetDDSAdditionSettings.java')
        def out = new StringBuilder()
        out << 'package carpetddsaddition.generated;\n\n'

        if (project.rule_api == 'legacy') {
            out << 'import carpet.settings.Rule;\n'
            out << 'import carpet.settings.RuleCategory;\n\n'
        }

        out << '@SuppressWarnings({"deprecation", "removal"})\n'
        out << 'public final class CarpetDDSAdditionSettings {\n'
        out << '    private CarpetDDSAdditionSettings() {}\n\n'

        if (project.rule_api == 'legacy') {
            activeRules.each { rule ->
                def cats = (['"DDS"'] + rule.categories.collect {
                    'RuleCategory.' + it.toString().toUpperCase(Locale.ROOT)
                }).join(', ')
                def desc = rule.description.en_us.toString()
                        .replace('\\', '\\\\')
                        .replace('"', '\\"')
                def options = suggestionsFor(rule)
                def annotation = new StringBuilder()
                annotation << '    @Rule(desc = "' + desc + '", category = {' + cats + '}'
                if (!options.isEmpty() && rule.type != 'boolean') {
                    annotation << ', options = {' + options.collect { quote(it) }.join(', ') + '}'
                }
                if (!strictFor(rule)) annotation << ', strict = false'
                annotation << ')\n'
                out << annotation
                out << "    public static ${rule.type} ${rule.name} = ${javaLiteral(rule)};\n\n"
            }
        }

        out << '}\n'
        f.text = out.toString()

        /*
         * RubixDev carpet-database discovers rule names by scanning an annotated
         * settings class, then reads the real CarpetRule from the configured
         * SettingsManager. Keep that extraction contract without reintroducing
         * mutable modern static rule state.
         */
        def databaseHints = new File(pkgDir, 'DDSRuleDatabaseHints.java')
        def hints = new StringBuilder()
        hints << 'package carpetddsaddition.generated;\n\n'
        if (project.rule_api == 'modern') {
            hints << 'import carpet.api.settings.Rule;\n'
            hints << 'import carpet.api.settings.RuleCategory;\n\n'
        } else {
            hints << 'import carpet.settings.Rule;\n'
            hints << 'import carpet.settings.RuleCategory;\n\n'
        }
        hints << '/** Extraction-only hints for RubixDev carpet-database. Never parse this class at runtime. */\n'
        hints << '@SuppressWarnings({"deprecation", "removal"})\n'
        hints << 'public final class DDSRuleDatabaseHints {\n'
        hints << '    private DDSRuleDatabaseHints() {}\n\n'

        activeRules.each { rule ->
            def cats = (['"DDS"'] + rule.categories.collect {
                'RuleCategory.' + it.toString().toUpperCase(Locale.ROOT)
            }).join(', ')
            def options = suggestionsFor(rule)
            def strict = strictFor(rule)

            if (project.rule_api == 'modern') {
                hints << '    @Rule(categories = {' + cats + '}'
                if (!options.isEmpty() && rule.type != 'boolean') {
                    hints << ', options = {' + options.collect { quote(it) }.join(', ') + '}'
                }
                if (!strict) hints << ', strict = false'
                hints << ')\n'
            } else {
                def desc = rule.description.en_us.toString()
                        .replace('\\', '\\\\')
                        .replace('"', '\\"')
                hints << '    @Rule(desc = "' + desc + '", category = {' + cats + '}'
                if (!options.isEmpty() && rule.type != 'boolean') {
                    hints << ', options = {' + options.collect { quote(it) }.join(', ') + '}'
                }
                if (!strict) hints << ', strict = false'
                hints << ')\n'
            }
            hints << "    public static final ${rule.type} ${rule.name} = ${javaLiteral(rule)};\n\n"
        }
        hints << '}\n'
        databaseHints.text = hints.toString()

        /*
         * DDSRules is the only generated API consumed by feature code.
         * Modern targets use a DDS-owned store. Legacy targets bridge directly
         * to Carpet's annotated static field so there is never a second mutable value.
         */
        def facade = new File(pkgDir, 'DDSRules.java')
        def api = new StringBuilder()
        api << 'package carpetddsaddition.generated;\n\n'
        api << 'import carpetddsaddition.core.rules.DdsRule;\n'
        api << 'import carpetddsaddition.core.rules.DdsRuleCodecs;\n'
        api << 'import carpetddsaddition.core.rules.DdsRuleRegistry;\n\n'
        api << 'public final class DDSRules {\n'
        api << '    private static final DdsRuleRegistry REGISTRY = new DdsRuleRegistry();\n'
        api << '    private DDSRules() {}\n\n'

        spec.rules.each { rule ->
            def field = constantName(rule)
            def boxed = wrapperType(rule)
            def categories = stringArray(categoriesFor(rule))
            def suggestions = stringArray(suggestionsFor(rule))
            def strict = strictFor(rule)
            def codec = 'DdsRuleCodecs.' + codecName(rule)
            def factory

            if (!isRuleActive(rule)) {
                factory = "DdsRule.unavailable(${quote(rule.name)}, ${boxed}.class, ${javaLiteral(rule)}, ${categories}, ${suggestions}, ${strict}, ${codec})"
            } else if (project.rule_api == 'modern') {
                factory = "DdsRule.owned(${quote(rule.name)}, ${boxed}.class, ${javaLiteral(rule)}, ${categories}, ${suggestions}, ${strict}, ${codec})"
            } else {
                factory = "DdsRule.bridged(${quote(rule.name)}, ${boxed}.class, ${javaLiteral(rule)}, ${categories}, ${suggestions}, ${strict}, ${codec}, () -> CarpetDDSAdditionSettings.${rule.name}, value -> CarpetDDSAdditionSettings.${rule.name} = value)"
            }

            api << "    public static final DdsRule<${boxed}> ${field} = REGISTRY.register(${factory});\n"
        }

        api << '\n    static { REGISTRY.freeze(); }\n\n'
        api << '    public static DdsRuleRegistry registry() { return REGISTRY; }\n'
        api << '    public static void captureCurrentState() {\n'
        api << '        for (DdsRule<?> rule : REGISTRY.available()) rule.captureCurrentState();\n'
        api << '    }\n\n'

        spec.rules.each { rule ->
            api << "    public static ${rule.type} ${rule.name}() {\n"
            if (!isRuleActive(rule)) {
                api << "        return ${javaLiteral(rule)};\n"
            } else if (project.rule_api == 'legacy') {
                /*
                 * Preserve the historical primitive hot path. The typed
                 * DdsRule handle is the control-plane identity, while the
                 * legacy Carpet field is the one physical value store.
                 */
                api << "        return CarpetDDSAdditionSettings.${rule.name};\n"
            } else {
                api << "        return ${constantName(rule)}.value();\n"
            }
            api << '    }\n\n'
        }

        api << '}\n'
        facade.text = api.toString()

        /*
         * Translations use the CDA SettingsManager identifier, not Carpet's
         * global "carpet" namespace.
         */
        def translations = new File(pkgDir, 'DDSRuleTranslations.java')
        def tr = new StringBuilder()
        tr << 'package carpetddsaddition.generated;\n\n'
        tr << 'import java.util.HashMap;\n'
        tr << 'import java.util.Map;\n\n'
        tr << 'public final class DDSRuleTranslations {\n'
        tr << '    private static final String PREFIX = "carpet-dds-addition.rule.";\n'
        tr << '    private DDSRuleTranslations() {}\n\n'
        tr << '    public static Map<String, String> forLanguage(String lang) {\n'
        tr << '        Map<String, String> values = new HashMap<>();\n'

        def languages = new LinkedHashSet<String>()
        activeRules.each { rule ->
            languages.addAll(rule.description.keySet().collect { it.toString() })
            if (rule.containsKey('displayName')) {
                languages.addAll(rule.displayName.keySet().collect { it.toString() })
            }
        }
        languages.remove('en_us')

        languages.each { language ->
            tr << '        if (' + quote(language) + '.equals(lang)) {\n'
            activeRules.each { rule ->
                if (rule.containsKey('displayName') && rule.displayName.containsKey(language)) {
                    tr << '            values.put(PREFIX + "' + rule.name + '.name", ' + quote(rule.displayName[language]) + ');\n'
                }
                def rawDescription = rule.description.containsKey(language)
                        ? rule.description[language]
                        : rule.description.en_us
                tr << '            values.put(PREFIX + "' + rule.name + '.desc", ' + quote(rawDescription) + ');\n'
            }
            tr << '            return values;\n'
            tr << '        }\n'
        }

        activeRules.each { rule ->
            tr << '        values.put(PREFIX + "' + rule.name + '.desc", ' + quote(rule.description.en_us) + ');\n'
        }
        tr << '        return values;\n'
        tr << '    }\n'
        tr << '}\n'
        translations.text = tr.toString()

        /*
         * Machine-readable rule ABI and carpet-database RawRule export. These
         * are generated from the same source and packaged with every target JAR.
         */
        def metadataDir = new File(generatedRuleResourceDir, 'META-INF/dds')
        metadataDir.mkdirs()

        def manifestRules = activeRules.collect { rule ->
            def entry = new LinkedHashMap<String, Object>()
            entry.id = rule.name.toString()
            entry.type = rule.type.toString()
            entry.defaultValue = rule.default
            entry.categories = categoriesFor(rule)
            entry.suggestions = suggestionsFor(rule)
            entry.strict = strictFor(rule)
            if (rule.containsKey('minMc')) entry.minMc = rule.minMc
            if (rule.containsKey('maxMc')) entry.maxMc = rule.maxMc
            entry
        }

        def manifest = [
                manager: 'carpet-dds-addition',
                schema: 1,
                minecraft: project.minecraft_version,
                rules: manifestRules,
        ]
        new File(metadataDir, 'rules.json').text =
                JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n'

        def carpetDatabaseRules = activeRules.collect { rule ->
            def options = suggestionsFor(rule)
            // Carpet only enforces strictness when the rule has options.
            def effectiveStrict = strictFor(rule) && !options.isEmpty()
            [
                    name: rule.name.toString(),
                    description: rule.description.en_us.toString(),
                    type: rule.type.toString(),
                    value: rule.default.toString(),
                    strict: effectiveStrict,
                    categories: categoriesFor(rule).collect {
                        it.toString().toUpperCase(Locale.ROOT)
                    },
                    options: options,
                    extras: [],
                    validators: [],
                    config_files: ['carpet-dds-addition'],
            ]
        }
        new File(metadataDir, 'carpet-database-rules.json').text =
                JsonOutput.prettyPrint(JsonOutput.toJson(carpetDatabaseRules)) + '\n'
    }
}

tasks.named('processResources').configure {
    dependsOn 'generateDDSRules'
    from(generatedRuleResourceDir)
}
tasks.named('compileJava', JavaCompile).configure {
    dependsOn 'generateDDSRules'

    // Generated rule API is target-specific build output. Compile it directly
    // rather than adding it to main SourceSet, otherwise ReplayMod Preprocessor
    // inherits it through the version graph and creates duplicate classes in
    // downstream targets.
    source(generatedRuleDir)
}

/*
 * Tests live once in the repository root and compile against the preprocessed
 * 1.21.11 main output.
 *
 * Use setSrcDirs instead of srcDir: ReplayMod Preprocessor/Loom may already
 * configure test source locations for a version project. Appending the root
 * directory can therefore make javac receive the same source file twice.
 *
 * Non-canonical targets are explicitly empty so build/buildAndGather cannot
 * accidentally compile this shared contract suite on every Minecraft version.
 */
sourceSets {
    test {
        java.setSrcDirs(
                networkContractTestTarget
                        ? [
                            rootProject.file(
                                    'src/test/java'
                            )
                        ]
                        : []
        )

        resources.setSrcDirs([])
    }
}

if (networkContractTestTarget) {
    tasks.named('test', Test).configure {
        useJUnitPlatform()

        javaLauncher.set(gameJavaLauncher)

        systemProperty(
                'file.encoding',
                'UTF-8'
        )
    }
}

loom {
    mixin {
        useLegacyMixinAp = !unobfuscated
    }

    runConfigs.configureEach {
        runDir '../../run'
        ideConfigGenerated true

        /*
         * IDEA-generated run configurations should invoke Loom runs through
         * Gradle so every run uses DDS's explicit JavaLauncher.
         */
        getPreferGradleTask().set(true)
    }

    /*
     * Phase 7 Mixin audit runs.
     *
     * Keep audit runs out of IDEA's generated run configuration list. They are
     * verification tasks rather than normal development launch profiles.
     *
     * Each Minecraft target gets an isolated run directory so all-version
     * auditing cannot share world/config state between version nodes.
     */
    runs {
        mixinAudit {
            server()

            runDir "../../run/mixin-audit/${project.name}/server"

            vmArgs(
                    '-Dcarpetddsaddition.mixin_audit=true'
            )

            ideConfigGenerated false
        }

        mixinAuditClient {
            client()

            runDir "../../run/mixin-audit/${project.name}/client"

            vmArgs(
                    '-Dcarpetddsaddition.mixin_audit=true'
            )

            ideConfigGenerated false
        }

        protocolBaseline {
            server()

            runDir "../../run/protocol-baseline/${project.name}"

            vmArgs(
                    '-Dcarpetddsaddition.protocol_baseline=true'
            )

            ideConfigGenerated false
        }
    }
}

/*
 * Fabric Loom's game run tasks extend JavaExec. Bind only the standard game
 * launch tasks; the Gradle daemon itself may continue running on a different
 * supported JDK.
 */
final List<String> gameRunTaskNames = [
        'runClient',
        'runServer',
        'runMixinAudit',
        'runMixinAuditClient',
        'runProtocolBaseline',
]

tasks.withType(JavaExec).configureEach {
    if (gameRunTaskNames.contains(name)) {
        javaLauncher.set(gameJavaLauncher)
    }
}

/*
 * Resolve and verify the launcher without starting Minecraft.
 *
 * Besides checking the requested Java major, verify the actual Loom JavaExec
 * tasks still point at the same launcher. This catches a future Loom/Gradle
 * configuration change where gameJavaLauncher exists but runClient/runServer
 * accidentally stop using it.
 */
tasks.register('verifyJavaRuntime') {
    group = 'verification'

    description =
            "Verifies the Java ${javaLevel} runtime used by Loom game runs."

    doLast {
        def launcher

        try {
            launcher =
                    gameJavaLauncher.get()
        } catch (Exception ex) {
            throw new GradleException(
                    "Unable to resolve Java ${javaLevel} for "
                            + "${project.path}. Check local Gradle "
                            + "toolchains, network access and the "
                            + "Foojay resolver configuration.",
                    ex
            )
        }

        int actualLevel =
                launcher.metadata
                        .languageVersion
                        .asInt()

        if (actualLevel != javaLevel) {
            throw new GradleException(
                    "Expected Java ${javaLevel} for ${project.path}, "
                            + "resolved Java ${actualLevel}"
            )
        }

        File gameExecutable =
                launcher.executablePath
                        .asFile
                        .canonicalFile

        File gameJavaHome =
                launcher.metadata
                        .installationPath
                        .asFile
                        .canonicalFile

        gameRunTaskNames.each { runTaskName ->
            JavaExec runTask =
                    tasks.named(
                            runTaskName,
                            JavaExec
                    ).get()

            def runLauncher =
                    runTask.javaLauncher
                            .getOrNull()

            if (runLauncher == null) {
                throw new GradleException(
                        "${project.path}:${runTaskName} has no "
                                + "configured JavaLauncher"
                )
            }

            int runLevel =
                    runLauncher.metadata
                            .languageVersion
                            .asInt()

            File runExecutable =
                    runLauncher.executablePath
                            .asFile
                            .canonicalFile

            if (runLevel != javaLevel
                    || runExecutable != gameExecutable) {
                throw new GradleException(
                        "${project.path}:${runTaskName} is not using "
                                + "the expected Java ${javaLevel} "
                                + "launcher. Resolved: Java "
                                + "${runLevel} -> ${runExecutable}"
                )
            }
        }

        int gradleJavaLevel =
                Integer.parseInt(
                        JavaVersion.current()
                                .majorVersion
                )

        File gradleJavaHome =
                new File(
                        System.getProperty('java.home')
                ).canonicalFile

        /*
         * If Gradle itself runs on another Java major, the game runtime must
         * not resolve back to that same installation. This is the concrete
         * invariant Phase 4 was introduced to guarantee.
         */
        if (gradleJavaLevel != javaLevel
                && gradleJavaHome == gameJavaHome) {
            throw new GradleException(
                    "${project.path} expected isolated game Java "
                            + "${javaLevel}, but Gradle Java "
                            + "${gradleJavaLevel} and the game resolved "
                            + "to the same installation: "
                            + "${gameJavaHome}"
            )
        }

        println(
                "${project.path}: game Java ${actualLevel} "
                        + "(${launcher.metadata.vendor}, "
                        + "${launcher.metadata.jvmVersion})"
        )

        println(
                "  game runtime : ${gameExecutable}"
        )

        println(
                "  Gradle JVM   : Java ${gradleJavaLevel} -> "
                        + "${gradleJavaHome}"
        )

        println(
                "  Loom runs    : "
                        + gameRunTaskNames.join(', ')
                        + " [verified]"
        )

        println(
                "  isolation    : "
                        + (
                            gradleJavaLevel == javaLevel
                                    ? "same Java major; explicit launcher verified"
                                    : "separate Java major verified"
                        )
        )
    }
}

group = project.maven_group
version = "v${project.mod_version}-mc${project.minecraft_version}"
base.archivesName = project.archives_base_name

processResources {
    def mixinLevel = "JAVA_${javaLevel}"

    def props = [
            id                  : project.mod_id,
            name                : project.mod_name,
            version             : project.mod_version,
            minecraft_dependency: project.minecraft_dependency,
            carpet_dependency   : project.carpet_dependency,
            loader_dependency   : project.loader_dependency,
            java_dependency     : ">=${javaLevel}",
            mixin_compatibility : mixinLevel,
    ]

    inputs.properties(props)
    inputs.property('ddsOwnershipWireMode', handoffWireMode ?: '')

    filesMatching('fabric.mod.json') {
        expand(props)
    }

    filesMatching('carpet-dds-addition.mixins.json') {
        expand(props)
    }

    doLast {
        if (!logicalClientHandedOff) return
        if (handoffWireMode == null) {
            throw new GradleException(
                    "Missing DDS wire mode for logical-client handoff target "
                            + project.minecraft_version
            )
        }

        def metadataFile = new File(destinationDir, 'fabric.mod.json')
        def metadata = new JsonSlurper().parse(metadataFile)
        if (!(metadata.custom instanceof Map)) metadata.custom = [:]
        def ownershipMarker = [
                contract            : 1,
                logical_client_owner: 'tweak',
                wire_mode           : handoffWireMode
        ]
        metadata.custom['dds:network_ownership'] = ownershipMarker
        metadataFile.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(metadata))
                        + System.lineSeparator(),
                'UTF-8'
        )

        def mixinFile = new File(destinationDir, 'carpet-dds-addition.mixins.json')
        def mixinConfig = new JsonSlurper().parse(mixinFile)
        mixinConfig.client = (mixinConfig.client ?: []).findAll {
            !logicalClientMixins.contains(it)
        }
        mixinFile.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(mixinConfig))
                        + System.lineSeparator(),
                'UTF-8'
        )
    }
}

def ruleArtifactTaskName = unobfuscated ? 'jar' : 'remapJar'

tasks.register('verifyRuleArtifact') {
    group = 'verification'
    dependsOn tasks.named(ruleArtifactTaskName)

    doLast {
        def archiveTask = tasks.named(ruleArtifactTaskName).get()
        File archive = archiveTask.archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def manifestEntry = zip.getEntry('META-INF/dds/rules.json')
            def databaseEntry = zip.getEntry('META-INF/dds/carpet-database-rules.json')
            if (manifestEntry == null || databaseEntry == null) {
                throw new GradleException("${project.path}: final JAR is missing DDS rule metadata")
            }

            def manifest
            zip.getInputStream(manifestEntry).withCloseable { stream ->
                manifest = new JsonSlurper().parse(stream)
            }
            if (manifest.manager != 'carpet-dds-addition') {
                throw new GradleException("${project.path}: wrong DDS rule manager in final JAR: ${manifest.manager}")
            }
            if (manifest.minecraft.toString() != project.minecraft_version.toString()) {
                throw new GradleException("${project.path}: rule manifest target ${manifest.minecraft} does not match ${project.minecraft_version}")
            }

            def spec = new JsonSlurper().parse(ruleSpecFile)
            def expected = spec.rules.findAll { rule ->
                int minMc = rule.containsKey('minMc') ? (rule.minMc as int) : Integer.MIN_VALUE
                int maxMc = rule.containsKey('maxMc') ? (rule.maxMc as int) : Integer.MAX_VALUE
                mcVersion >= minMc && mcVersion <= maxMc
            }.collect { it.name.toString() } as Set
            def packaged = manifest.rules.collect { it.id.toString() } as Set
            if (packaged != expected) {
                throw new GradleException("${project.path}: final JAR rule manifest does not match rules.json; expected=${expected}, packaged=${packaged}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('build').configure {
    dependsOn tasks.named('verifyRuleArtifact')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(javaCompatibility.majorVersion)
    options.compilerArgs += [
            '-Xlint:deprecation',
            '-Xlint:unchecked'
    ]
}

java {
    sourceCompatibility = javaCompatibility
    targetCompatibility = javaCompatibility
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename {
            "${it}_${project.archives_base_name}"
        }
    }

    manifest {
        attributes(
                'Implementation-Title': project.mod_name,
                'Implementation-Version': project.mod_version,
                'Minecraft-Target': project.minecraft_dependency
        )
    }
}

if (!unobfuscated) {
    tasks.named('build').configure {
        dependsOn tasks.named('remapJar')
    }
}
