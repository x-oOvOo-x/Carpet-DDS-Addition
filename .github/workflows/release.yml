name: Release Carpet DDS Addition

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"

          if [[ -z "$MOD_VERSION" ]]; then
            echo "mod_version was not found in gradle.properties"
            exit 1
          fi

          EXPECTED_TAG="v${MOD_VERSION}"

          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version=${MOD_VERSION}"
            echo "Expected tag: ${EXPECTED_TAG}"
            exit 1
          fi

          RELEASE_NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"

          if [[ ! -f "${RELEASE_NOTES}" ]]; then
            echo "Release notes not found: ${RELEASE_NOTES}"
            exit 1
          fi

          echo "MOD_VERSION=${MOD_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=${RELEASE_NOTES}" >> "$GITHUB_ENV"

      - name: Verify framework invariants
        run: python3 scripts/verify-framework.py

      - name: Build every Minecraft target
        run: ./gradlew buildAndGather --stacktrace

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "Carpet DDS Addition ${MOD_VERSION}" \
              --notes-file "${RELEASE_NOTES}"
          else
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Carpet DDS Addition ${MOD_VERSION}" \
              --notes-file "${RELEASE_NOTES}"
          fi

          gh release upload \
            "${GITHUB_REF_NAME}" \
            build/releases/*.jar \
            --clobber

      - name: Publish versions to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_SLUG: ${{ vars.MODRINTH_PROJECT_SLUG }}
        run: |
          python3 scripts/publish-modrinth.py \
            --project "${MODRINTH_PROJECT_SLUG}" \
            --version "${MOD_VERSION}" \
            --release-dir build/releases \
            --config scripts/modrinth-versions.json \
            --changelog-file "${RELEASE_NOTES}"