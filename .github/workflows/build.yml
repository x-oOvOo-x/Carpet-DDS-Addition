name: Build Carpet DDS Addition

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'versions/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'docs/**'
      - 'README*.md'
      - 'build.gradle'
      - 'common.gradle'
      - 'settings.gradle'
      - 'settings.json'
      - 'gradle.properties'
      - '.github/workflows/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify framework invariants
        run: python3 scripts/verify-framework.py
      - name: Build every Minecraft node
        run: ./gradlew buildAndGather --stacktrace
      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: carpet-dds-addition-jars
          path: build/releases/*.jar
