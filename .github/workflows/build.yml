name: Build Carpet DDS Addition

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'versions/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'common.gradle'
      - 'settings.gradle'
      - 'settings.json'
      - 'gradle.properties'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'versions/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'common.gradle'
      - 'settings.gradle'
      - 'settings.json'
      - 'gradle.properties'
      - '.github/workflows/**'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate release publisher scripts
        run: py -3 -m py_compile scripts/publish-modrinth.py scripts/publish-curseforge.py
      - name: Verify and build every Minecraft node
        run: gradlew.bat buildAndGather --stacktrace
      - name: Verify preprocessor round-trip
        run: py -3 scripts/verify-preprocessor-roundtrip.py --skip-build
      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: carpet-dds-addition-jars
          path: build/releases/*.jar
