name: Build Carpet DDS Addition

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'versions/**'
      - 'scripts/**'
      - 'tools/publish-public.ps1'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'common.gradle'
      - 'settings.gradle'
      - 'settings.json'
      - 'config/**'
      - 'gradle.properties'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'versions/**'
      - 'scripts/**'
      - 'tools/publish-public.ps1'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'common.gradle'
      - 'settings.gradle'
      - 'settings.json'
      - 'config/**'
      - 'gradle.properties'
      - '.github/workflows/**'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-self-hosted:
    defaults:
      run:
        working-directory: source-build
    if: ${{ (vars.RUNNER_MODE == 'self-hosted' || (vars.RUNNER_MODE == '' && github.repository == 'x-oOvOo-x/Carpet-DDS-Addition-Dev')) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: write
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          path: source-build
          clean: false

      - name: Configure persistent short Gradle home
        shell: powershell
        run: |
          $drive = [System.IO.Path]::GetPathRoot($env:RUNNER_WORKSPACE)
          $gradleHome = Join-Path $drive 'g\dds-build'
          New-Item -ItemType Directory -Force -Path $gradleHome | Out-Null
          Remove-Item (Join-Path $gradleHome '.tmp') -Recurse -Force -ErrorAction SilentlyContinue
          "GRADLE_USER_HOME=$gradleHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Install Zulu JDK 17 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Remember JDK 17
        shell: powershell
        run: '"DDS_JAVA17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Install Zulu JDK 21 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Remember JDK 21
        shell: powershell
        run: '"DDS_JAVA21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Restore JDK 25 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Register local game toolchains
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:GRADLE_USER_HOME | Out-Null
          $java17 = $env:DDS_JAVA17_HOME.Replace('\\', '/')
          $java21 = $env:DDS_JAVA21_HOME.Replace('\\', '/')
          "org.gradle.java.installations.paths=$java17,$java21" | Out-File -FilePath "$env:GRADLE_USER_HOME\gradle.properties" -Encoding utf8
      - name: Check self-hosted environment
        shell: cmd
        run: |
          echo JAVA_HOME=%JAVA_HOME%
          where java
          where javac
          where py
          java -version
          javac -version
          py -3 --version
          gradlew.bat --version

      - name: Validate release publisher scripts
        shell: cmd
        run: py -3 -m py_compile scripts/publish-curseforge.py

      - name: Check Dev Public-publisher PowerShell syntax
        if: ${{ github.repository == 'x-oOvOo-x/Carpet-DDS-Addition-Dev' }}
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'tools/publish-public.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }

      - name: Test offline Python regressions
        shell: cmd
        run: py -3 -m unittest discover -s scripts -p "test*.py" -v || exit /b 1

      - name: Verify and build every Minecraft node
        shell: cmd
        run: gradlew.bat buildAndGather --stacktrace

      - name: Verify preprocessor round-trip
        shell: cmd
        run: py -3 scripts/verify-preprocessor-roundtrip.py --skip-build

      - name: Audit final runtime JARs and retired client boundaries
        shell: cmd
        run: py -3 scripts/audit_release_artifacts.py --directory build/releases || exit /b 1

      - name: Publish temporary CI PR release (no Artifact quota)
        if: ${{ github.repository == 'x-oOvOo-x/Carpet-DDS-Addition-Dev' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_SHA: ${{ github.sha }}
          CI_TAG: ci-pr-${{ github.event.pull_request.number }}
        run: ./scripts/publish-ci-pr-release.ps1

      - name: Stop Gradle daemons
        if: always()
        continue-on-error: true
        shell: cmd
        run: gradlew.bat --stop

  build-cloud:
    if: ${{ vars.RUNNER_MODE == 'cloud' || (vars.RUNNER_MODE == '' && github.repository == 'x-oOvOo-x/Carpet-DDS-Addition') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        shell: bash
        run: chmod +x gradlew

      - name: Validate release publisher scripts
        shell: bash
        run: python3 -m py_compile scripts/publish-curseforge.py

      - name: Test offline Python regressions
        shell: bash
        run: python3 -m unittest discover -s scripts -p "test*.py" -v

      - name: Verify and build every Minecraft node
        shell: bash
        run: ./gradlew buildAndGather --stacktrace

      - name: Verify preprocessor round-trip
        shell: bash
        run: python3 scripts/verify-preprocessor-roundtrip.py --skip-build

      - name: Audit final runtime JARs and retired client boundaries
        shell: bash
        run: python3 scripts/audit_release_artifacts.py --directory build/releases
