name: Build Carpet DDS Addition

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'versions/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'common.gradle'
      - 'settings.gradle'
      - 'settings.json'
      - 'gradle.properties'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'versions/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'common.gradle'
      - 'settings.gradle'
      - 'settings.json'
      - 'gradle.properties'
      - '.github/workflows/**'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-self-hosted:
    if: ${{ vars.RUNNER_MODE == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Check self-hosted environment
        shell: cmd
        run: |
          echo JAVA_HOME=%JAVA_HOME%
          where java
          where javac
          where py
          java -version
          javac -version
          py -3 --version
          gradlew.bat --version

      - name: Validate release publisher scripts
        shell: cmd
        run: py -3 -m py_compile scripts/publish-modrinth.py scripts/publish-curseforge.py

      - name: Verify and build every Minecraft node
        shell: cmd
        run: gradlew.bat buildAndGather --stacktrace

      - name: Verify preprocessor round-trip
        shell: cmd
        run: py -3 scripts/verify-preprocessor-roundtrip.py --skip-build

  build-cloud:
    if: ${{ vars.RUNNER_MODE == 'cloud' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        shell: bash
        run: chmod +x gradlew

      - name: Validate release publisher scripts
        shell: bash
        run: python3 -m py_compile scripts/publish-modrinth.py scripts/publish-curseforge.py

      - name: Verify and build every Minecraft node
        shell: bash
        run: ./gradlew buildAndGather --stacktrace

      - name: Verify preprocessor round-trip
        shell: bash
        run: python3 scripts/verify-preprocessor-roundtrip.py --skip-build

      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: carpet-dds-addition-jars
          path: build/releases/*.jar
