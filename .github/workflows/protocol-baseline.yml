name: DDS Protocol Baseline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/main/java/carpetddsaddition/network/**'
      - 'src/main/java/carpetddsaddition/mixin/network/**'
      - 'src/main/java/carpetddsaddition/core/network/**'
      - 'src/main/java/carpetddsaddition/feature/**/network/**'
      - 'src/main/java/carpetddsaddition/integration/**/network/**'
      - 'src/test/java/carpetddsaddition/**/network/**'
      - 'src/main/java/carpetddsaddition/CarpetDDSAddition.java'
      - 'common.gradle'
      - 'build.gradle'
      - 'config/dds-client-ownership-contract.json'
      - '.github/workflows/protocol-baseline.yml'
  pull_request:
    paths:
      - 'src/main/java/carpetddsaddition/network/**'
      - 'src/main/java/carpetddsaddition/mixin/network/**'
      - 'src/main/java/carpetddsaddition/core/network/**'
      - 'src/main/java/carpetddsaddition/feature/**/network/**'
      - 'src/main/java/carpetddsaddition/integration/**/network/**'
      - 'src/test/java/carpetddsaddition/**/network/**'
      - 'src/main/java/carpetddsaddition/CarpetDDSAddition.java'
      - 'common.gradle'
      - 'build.gradle'
      - 'config/dds-client-ownership-contract.json'
      - '.github/workflows/protocol-baseline.yml'

concurrency:
  group: protocol-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-baseline:
    defaults:
      run:
        working-directory: source-protocol
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: source-protocol
          clean: false

      - name: Configure persistent short Gradle home
        shell: powershell
        run: |
          $drive = [System.IO.Path]::GetPathRoot($env:RUNNER_WORKSPACE)
          $gradleHome = Join-Path $drive 'g\dds-protocol'
          New-Item -ItemType Directory -Force -Path $gradleHome | Out-Null
          Remove-Item (Join-Path $gradleHome '.tmp') -Recurse -Force -ErrorAction SilentlyContinue
          "GRADLE_USER_HOME=$gradleHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Install Zulu JDK 17 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Remember JDK 17
        shell: powershell
        run: '"DDS_JAVA17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Install Zulu JDK 21 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Remember JDK 21
        shell: powershell
        run: '"DDS_JAVA21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Install Zulu JDK 25 game toolchain
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Remember Zulu JDK 25
        shell: powershell
        run: '"DDS_JAVA25_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Restore JDK 25 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Register local game toolchains
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:GRADLE_USER_HOME | Out-Null
          $java17 = $env:DDS_JAVA17_HOME.Replace('\\', '/')
          $java21 = $env:DDS_JAVA21_HOME.Replace('\\', '/')
          $java25 = $env:DDS_JAVA25_HOME.Replace('\\', '/')
          "org.gradle.java.installations.paths=$java17,$java21,$java25" | Out-File -FilePath "$env:GRADLE_USER_HOME\gradle.properties" -Encoding utf8
      - name: Check environment
        shell: cmd
        run: |
          where java
          where javac
          where py
          java -version
          gradlew.bat --version

      - name: Build network boundary targets
        shell: cmd
        run: gradlew.bat :1.20.1:build :1.20.2:build :1.20.4:build :1.20.6:build :26.3:build --stacktrace --no-parallel

      - name: Run DDS Protocol baseline
        shell: cmd
        run: gradlew.bat auditProtocolBaseline --continue --stacktrace --no-parallel

      - name: Stop Gradle daemons
        if: always()
        continue-on-error: true
        shell: cmd
        run: gradlew.bat --stop
