name: Republish Release Platforms

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v1.6.0 or 1.6.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: republish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  republish-self-hosted:
    if: ${{ github.repository == 'x-oOvOo-x/Carpet-DDS-Addition' && vars.RUNNER_MODE == 'self-hosted' }}
    runs-on: [self-hosted, Windows, X64]
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      RELEASE_TAG_INPUT: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check self-hosted environment
        shell: cmd
        run: |
          where py
          where gh
          py -3 --version
          gh --version

      - name: Prepare existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "$tag=($env:RELEASE_TAG_INPUT).Trim();
          if (-not $tag.StartsWith('v')) { $tag='v'+$tag };
          if ($tag -notmatch '^v[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z.-]+)?$') { throw ('Invalid release tag: '+$env:RELEASE_TAG_INPUT) };
          $ver=$tag.Substring(1);
          $notes='docs/release-notes/'+$tag+'.md';
          if (-not (Test-Path $notes)) { throw ('Release notes not found: '+$notes) };
          gh release view $tag | Out-Null;
          if ($LASTEXITCODE -ne 0) { throw ('GitHub Release not found: '+$tag) };
          if (Test-Path 'build/republish') { Remove-Item 'build/republish' -Recurse -Force };
          New-Item -ItemType Directory -Force -Path 'build/republish' | Out-Null;
          gh release download $tag --pattern '*.jar' --dir 'build/republish';
          if ($LASTEXITCODE -ne 0) { throw ('Failed to download jars for '+$tag) };
          ('RELEASE_TAG='+$tag) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append;
          ('MOD_VERSION='+$ver) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append;
          ('RELEASE_NOTES='+$notes) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

      - name: Check out exact release source for artifact policy
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: build/release-source

      - name: Audit downloaded tagged release artifacts
        id: release_preparation
        shell: cmd
        run: py -3 scripts/audit_release_artifacts.py --root build/release-source --directory build/republish --production || exit /b 1

      - name: Publish versions to CurseForge
        if: ${{ !cancelled() && steps.release_preparation.outcome == 'success' && env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != '' }}
        shell: cmd
        run: py -3 scripts/publish-curseforge.py --project "%CURSEFORGE_PROJECT_ID%" --version "%MOD_VERSION%" --release-dir build/republish --source-root build/release-source --config build/release-source/scripts/modrinth-versions.json --changelog-file "%RELEASE_NOTES%"

      - name: Skip CurseForge publishing
        if: ${{ !cancelled() && steps.release_preparation.outcome == 'success' && (env.CURSEFORGE_TOKEN == '' || env.CURSEFORGE_PROJECT_ID == '') }}
        shell: cmd
        run: echo Skipping CurseForge because its token/project is not configured.

  republish-cloud:
    if: ${{ github.repository == 'x-oOvOo-x/Carpet-DDS-Addition' && vars.RUNNER_MODE == 'cloud' }}
    runs-on: windows-latest
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      RELEASE_TAG_INPUT: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$(echo "$RELEASE_TAG_INPUT" | xargs)"
          RELEASE_TAG="v${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: $RELEASE_TAG_INPUT"; exit 1; }
          MOD_VERSION="${RELEASE_TAG#v}"
          RELEASE_NOTES="docs/release-notes/${RELEASE_TAG}.md"
          [[ -f "$RELEASE_NOTES" ]] || { echo "Release notes not found: $RELEASE_NOTES"; exit 1; }
          gh release view "$RELEASE_TAG" >/dev/null
          rm -rf build/republish
          mkdir -p build/republish
          gh release download "$RELEASE_TAG" --pattern '*.jar' --dir build/republish
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$RELEASE_NOTES" >> "$GITHUB_ENV"

      - name: Check out exact release source for artifact policy
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: build/release-source

      - name: Audit downloaded tagged release artifacts
        id: release_preparation
        shell: bash
        run: python3 scripts/audit_release_artifacts.py --root build/release-source --directory build/republish --production

      - name: Publish versions to CurseForge
        if: ${{ !cancelled() && steps.release_preparation.outcome == 'success' && env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != '' }}
        shell: bash
        run: python3 scripts/publish-curseforge.py --project "$CURSEFORGE_PROJECT_ID" --version "$MOD_VERSION" --release-dir build/republish --source-root build/release-source --config build/release-source/scripts/modrinth-versions.json --changelog-file "$RELEASE_NOTES"

      - name: Skip CurseForge publishing
        if: ${{ !cancelled() && steps.release_preparation.outcome == 'success' && (env.CURSEFORGE_TOKEN == '' || env.CURSEFORGE_PROJECT_ID == '') }}
        shell: bash
        run: echo "Skipping CurseForge because its token/project is not configured."
