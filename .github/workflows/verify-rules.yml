name: Verify Rule Documentation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/main/rules/rules.json'
      - 'docs/rules.md'
      - 'docs/rules-zh_cn.md'
      - 'scripts/verify-rule-docs.py'
      - '.github/workflows/verify-rules.yml'
  pull_request:
    paths:
      - 'src/main/rules/rules.json'
      - 'docs/rules.md'
      - 'docs/rules-zh_cn.md'
      - 'scripts/verify-rule-docs.py'
      - '.github/workflows/verify-rules.yml'

concurrency:
  group: verify-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify rule documentation
        run: python3 scripts/verify-rule-docs.py
