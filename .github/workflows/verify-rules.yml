name: Verify Rule Documentation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/main/rules/rules.json'
      - 'docs/rules.md'
      - 'docs/rules-zh_cn.md'
      - 'scripts/verify-rule-docs.py'
      - '.github/workflows/verify-rules.yml'
  pull_request:
    paths:
      - 'src/main/rules/rules.json'
      - 'docs/rules.md'
      - 'docs/rules-zh_cn.md'
      - 'scripts/verify-rule-docs.py'
      - '.github/workflows/verify-rules.yml'

concurrency:
  group: verify-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-self-hosted:
    if: ${{ vars.RUNNER_MODE == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Verify rule documentation
        shell: cmd
        run: py -3 scripts/verify-rule-docs.py

  verify-cloud:
    if: ${{ vars.RUNNER_MODE == 'cloud' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify rule documentation
        shell: bash
        run: python3 scripts/verify-rule-docs.py
